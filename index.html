<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="김민서(Minseo Kim) - 한국외국어대학교 Language & AI 융합학부 AI 개발자 포트폴리오">
    <meta name="keywords" content="김민서, Language & AI, 포트폴리오, AI 개발자, 바이브코딩, LLM 웹앱">
    <meta property="og:title" content="김민서 | Language & AI 융합 포트폴리오">
    <meta property="og:description" content="언어공학과 인공지능을 융합하고, 바이브코딩으로 아이디어를 현실로 만듭니다.">
    <title>김민서 | Language & AI 융합 개발자 포트폴리오</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+KR:wght@300;400;500;700;800&display=swap" rel="stylesheet">

    <!-- Master Stylesheet (with cache buster) -->
    <link rel="stylesheet" href="style.css?v=2">
</head>
<body>
    <!-- Background Glow Animations -->
    <div class="bg-decorations">
        <div class="blob-1"></div>
        <div class="blob-2"></div>
    </div>

    <!-- Navigation Bar Container -->
    <div id="navbarContainer">
        <!-- Dynamically rendered by Navbar.js component -->
    </div>

    <!-- Main Content Layout -->
    <main class="container">
        <!-- Hero & Profile Section -->
        <section id="profileSection" class="section">
            <!-- Dynamically rendered by js/components/profile.js -->
            <div style="text-align: center; padding: 40px; color: var(--text-muted);">
                프로필 정보를 불러오는 중입니다...
            </div>
        </section>

        <!-- Projects Showcase Section -->
        <section id="projects" class="section">
            <div class="section-header">
                <span class="section-tag">PORTFOLIO WORKSHOW</span>
                <h2 class="section-title">개발 프로젝트 & 작업물</h2>
                <p class="section-desc">Language & AI 전공 지식과 바이브코딩을 활용하여 제작한 사이트 및 앱입니다.</p>
            </div>

            <!-- Category Filter Pills -->
            <div id="categoryPills" class="category-filter-bar">
                <!-- Dynamically rendered by js/components/projectCard.js -->
            </div>

            <!-- Projects Grid -->
            <div id="projectsGrid" class="projects-grid">
                <!-- Dynamically rendered by js/components/projectCard.js -->
            </div>
        </section>

        <!-- Contact Section -->
        <section id="contact" class="section">
            <div class="contact-card">
                <h2 class="contact-title">함께 멋진 AI 서비스를 만들어볼까요? 🚀</h2>
                <p class="contact-subtitle">새로운 프로젝트 제안, 채용 문의, 또는 기술적 담소는 언제나 환영합니다.</p>
                
                <div id="contactActionsContainer" class="contact-actions">
                    <!-- Dynamically rendered by Button component in js/app.js -->
                </div>

                <!-- EmailJS Interactive Contact Form Slot -->
                <div id="contactFormSlot" style="margin-top: 32px;">
                    <!-- Dynamically rendered by ContactForm.js -->
                </div>
            </div>
        </section>
    </main>

    <!-- Detail Modal Dialog -->
    <div id="projectModalOverlay" class="modal-overlay" role="dialog" aria-hidden="true">
        <div class="modal-container">
            <button class="modal-close-btn" aria-label="닫기">✕</button>
            <div id="modalContent">
                <!-- Dynamically rendered by js/components/modal.js -->
            </div>
        </div>
    </div>

    <!-- Toast Notification -->
    <div id="toastNotification" class="toast hidden" role="status">
        <span id="toastMessage">이메일 주소가 복사되었습니다!</span>
    </div>

    <!-- EmailJS SDK -->
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>

    <!-- Main JavaScript App (ES Module) -->
    <script type="module" src="js/app.js"></script>
</body>
</html>
